[package]
name = "physics-tasks"
version = "0.1.0"
description = "2D/3D Classical & Theoretical Mechanics Simulator (Tauri v2 + React + Rapier3D)"
authors = ["PhysicsTasks contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it's necessary for the compilation
# of both the library (for mobile) and the binary (for desktop).
name = "physics_tasks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
